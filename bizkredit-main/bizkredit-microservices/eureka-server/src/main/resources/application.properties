# Server port - the well-known Eureka port every other service points to
server.port=8761
spring.application.name=eureka-server

# A Eureka Server does not need to register with itself or fetch a
# registry from itself - it IS the registry.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.server.enable-self-preservation=false

# Logging
logging.level.com.netflix.eureka=ERROR
logging.level.com.netflix.discovery=ERROR
