# Server port
server.port=8082
spring.application.name=sme-loan-service

# MySQL database connection - shared bizkredit_db, this service owns
# sme_business, promoter, group_company, loan_application, application_document, loan_product
spring.datasource.url=jdbc:mysql://localhost:3306/bizkredit_sme_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate - update creates/alters tables automatically on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Swagger UI path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Logging
logging.level.com.bizkredit=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Disable open-in-view warning
spring.jpa.open-in-view=false

# Secret key used to verify JWT tokens issued by auth-service (must match across all services)
jwt.secret=${JWT_SECRET:bizkredit-super-secret-key-must-be-at-least-32-chars-long}

#Token validity period in milliseconds (86400000 = 24 hours)
jwt.expiration=86400000

# to persist authorization in swagger
springdoc.swagger-ui.persistAuthorization=true

#date and time
spring.jackson.date-format=dd-MM-yyyy HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata

# Eureka Client - registers this service with the Eureka Server so the
# API Gateway can discover it by name (sme-loan-service)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Folder on local disk where uploaded loan application documents are
# stored (see FileStorageService). Only the path is stored in MySQL -
# actual file bytes never touch the database.
app.upload-dir=./uploads/documents

# Cap individual uploaded documents at 10MB - generous enough for a
# scanned financial statement or annual report PDF, small enough to
# not let one bad upload exhaust disk space during a demo.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
