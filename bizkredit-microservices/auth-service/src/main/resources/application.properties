# Server port
server.port=8081
spring.application.name=auth-service

# MySQL database connection - shared bizkredit_db, auth-service owns users & audit_log tables
spring.datasource.url=jdbc:mysql://localhost:3306/bizkredit_auth_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate - update creates/alters tables automatically on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Swagger UI path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Logging
logging.level.com.bizkredit=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Disable open-in-view warning
spring.jpa.open-in-view=false

# Secret key used to sign and verify JWT tokens (must be at least 32 characters for HS256)
# Same secret across all services so gateway-issued / service-validated tokens interoperate
jwt.secret=${JWT_SECRET:bizkredit-super-secret-key-must-be-at-least-32-chars-long}

#Token validity period in milliseconds (86400000 = 24 hours)
jwt.expiration=86400000

# to persist authorization in swagger
springdoc.swagger-ui.persistAuthorization=true

#date and time
spring.jackson.date-format=dd-MM-yyyy HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata

# Eureka Client - registers this service with the Eureka Server so the
# API Gateway and other services can discover it by name (auth-service)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
